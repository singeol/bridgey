name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: gradle/actions/setup-gradle@v5
      - run: chmod +x android/gradlew
      - name: Android lint, tests, and debug build
        run: ./gradlew :app:lintDebug :core:discovery:lintDebug :app:testDebugUnitTest :core:discovery:testDebugUnitTest :app:assembleDebug
        working-directory: android
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: Android-lint-reports
          path: |
            android/app/build/reports/lint-results-debug.*
            android/core/discovery/build/reports/lint-results-debug.*
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7
        with:
          name: Bridgey-Android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - run: chmod +x build-app.sh
        working-directory: macos
      - name: Swift tests with warnings as errors
        run: swift test -Xswiftc -warnings-as-errors
        working-directory: macos
      - name: Validate scripts, Python, and app metadata
        run: |
          sh -n build-app.sh package-release.sh
          python3 -m py_compile create-icns.py
          plutil -lint Resources/Info.plist
        working-directory: macos
      - run: ./build-app.sh
        working-directory: macos
      - run: ditto -c -k --sequesterRsrc --keepParent .build/debug/BridgeyMac.app BridgeyMac-debug.zip
        working-directory: macos
      - uses: actions/upload-artifact@v7
        with:
          name: Bridgey-macOS-debug
          path: macos/BridgeyMac-debug.zip

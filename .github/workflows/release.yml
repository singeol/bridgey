name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: gradle/actions/setup-gradle@v5
      - name: Restore Android signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/bridgey-release.jks"
      - run: chmod +x android/gradlew
      - name: Build signed APK
        working-directory: android
        env:
          BRIDGEY_ANDROID_KEYSTORE: ${{ runner.temp }}/bridgey-release.jks
          BRIDGEY_ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          BRIDGEY_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          BRIDGEY_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease :app:testDebugUnitTest
      - name: Generate APK SBOM
        working-directory: android
        run: ./gradlew :app:cyclonedxDirectBom
      - name: Name and checksum APK and SBOM
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk Bridgey-Android.apk
          cp android/app/build/reports/cyclonedx-direct/bom.json Bridgey-Android.cdx.json
          shasum -a 256 Bridgey-Android.apk Bridgey-Android.cdx.json > SHA256SUMS-Android.txt
      - uses: actions/upload-artifact@v7
        with:
          name: Bridgey-Android
          path: |
            Bridgey-Android.apk
            Bridgey-Android.cdx.json
            SHA256SUMS-Android.txt

  macos:
    runs-on: macos-15
    env:
      MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
      APPLE_NOTARY_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
    steps:
      - uses: actions/checkout@v7
      - name: Import Developer ID certificate
        if: ${{ env.MACOS_CERTIFICATE_BASE64 != '' }}
        env:
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/bridgey-certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/bridgey-signing.keychain-db"
          echo "$MACOS_CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
      - name: Restore notarization API key
        if: ${{ env.APPLE_NOTARY_API_KEY_BASE64 != '' }}
        run: echo "$APPLE_NOTARY_API_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
      - run: chmod +x build-app.sh package-release.sh
        working-directory: macos
      - run: swift test -c release
        working-directory: macos
      - name: Sign, notarize, and package
        working-directory: macos
        env:
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_API_KEY_PATH: ${{ runner.temp }}/AuthKey.p8
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: ./package-release.sh
      - name: Write macOS SBOM
        working-directory: macos
        env:
          SOURCE_REPOSITORY: ${{ github.server_url }}/${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json, plistlib, os, re, subprocess, uuid
          from datetime import datetime, timezone

          def tool_version(command, pattern):
              try:
                  output = subprocess.run(command, capture_output=True, text=True, check=True).stdout
              except (OSError, subprocess.CalledProcessError):
                  return "unknown"
              match = re.search(pattern, output)
              return match.group(1) if match else "unknown"

          with open(".build/release/Bridgey.app/Contents/Info.plist", "rb") as plist:
              version = plistlib.load(plist)["CFBundleShortVersionString"]
          bom = {
              "bomFormat": "CycloneDX",
              "specVersion": "1.6",
              "serialNumber": f"urn:uuid:{uuid.uuid4()}",
              "version": 1,
              "metadata": {
                  "timestamp": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
                  "tools": {"components": [
                      {"type": "application", "name": "Swift", "version": tool_version(["swift", "--version"], r"Swift version (\S+)")},
                      {"type": "application", "name": "Xcode", "version": tool_version(["xcodebuild", "-version"], r"Xcode (\S+)")},
                      {"type": "operating-system", "name": "macOS", "version": tool_version(["sw_vers", "-productVersion"], r"(\S+)")},
                  ]},
                  "component": {
                      "type": "application",
                      "bom-ref": "bridgey-macos",
                      "name": "Bridgey",
                      "version": version,
                      "description": "Bridgey for macOS. The Swift package has no package dependencies; only Apple system frameworks are linked.",
                      "licenses": [{"license": {"id": "MIT"}}],
                      "externalReferences": [{"type": "vcs", "url": os.environ["SOURCE_REPOSITORY"]}],
                  },
              },
              "components": [],
              "dependencies": [{"ref": "bridgey-macos", "dependsOn": []}],
          }
          with open("dist/Bridgey-macOS.cdx.json", "w") as output:
              json.dump(bom, output, indent=2)
              output.write("\n")
          PY
          cd dist
          shasum -a 256 Bridgey-macOS.cdx.json >> SHA256SUMS-macOS.txt
          shasum -a 256 -c SHA256SUMS-macOS.txt
      - uses: actions/upload-artifact@v7
        with:
          name: Bridgey-macOS
          path: macos/dist/*

  attest:
    needs: [android, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - name: Verify checksums
        working-directory: artifacts
        run: shasum -a 256 -c SHA256SUMS-Android.txt SHA256SUMS-macOS.txt
      - name: Attest build provenance
        uses: actions/attest@v4
        with:
          subject-path: |
            artifacts/Bridgey-Android.apk
            artifacts/Bridgey-Android.cdx.json
            artifacts/SHA256SUMS-Android.txt
            artifacts/Bridgey-macOS.dmg
            artifacts/Bridgey-macOS.zip
            artifacts/Bridgey-macOS.cdx.json
            artifacts/SHA256SUMS-macOS.txt
      - name: Attest Android SBOM
        uses: actions/attest@v4
        with:
          subject-path: artifacts/Bridgey-Android.apk
          sbom-path: artifacts/Bridgey-Android.cdx.json
      - name: Attest macOS SBOM
        uses: actions/attest@v4
        with:
          subject-path: |
            artifacts/Bridgey-macOS.dmg
            artifacts/Bridgey-macOS.zip
          sbom-path: artifacts/Bridgey-macOS.cdx.json

  publish:
    needs: [attest]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          body_path: RELEASE_NOTES.md
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: artifacts/*

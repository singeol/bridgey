name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: gradle/actions/setup-gradle@v5
      - name: Restore Android signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/bridgey-release.jks"
      - run: chmod +x android/gradlew
      - name: Build signed APK
        working-directory: android
        env:
          BRIDGEY_ANDROID_KEYSTORE: ${{ runner.temp }}/bridgey-release.jks
          BRIDGEY_ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          BRIDGEY_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          BRIDGEY_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease :app:testDebugUnitTest
      - name: Name and checksum APK
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk Bridgey-Android.apk
          shasum -a 256 Bridgey-Android.apk > SHA256SUMS-Android.txt
      - uses: actions/upload-artifact@v7
        with:
          name: Bridgey-Android
          path: |
            Bridgey-Android.apk
            SHA256SUMS-Android.txt

  macos:
    runs-on: macos-15
    env:
      MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
      APPLE_NOTARY_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
    steps:
      - uses: actions/checkout@v7
      - name: Import Developer ID certificate
        if: ${{ env.MACOS_CERTIFICATE_BASE64 != '' }}
        env:
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/bridgey-certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/bridgey-signing.keychain-db"
          echo "$MACOS_CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
      - name: Restore notarization API key
        if: ${{ env.APPLE_NOTARY_API_KEY_BASE64 != '' }}
        run: echo "$APPLE_NOTARY_API_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
      - run: chmod +x build-app.sh package-release.sh
        working-directory: macos
      - run: swift test -c release
        working-directory: macos
      - name: Sign, notarize, and package
        working-directory: macos
        env:
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_API_KEY_PATH: ${{ runner.temp }}/AuthKey.p8
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: ./package-release.sh
      - uses: actions/upload-artifact@v7
        with:
          name: Bridgey-macOS
          path: macos/dist/*

  publish:
    needs: [android, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          body_path: RELEASE_NOTES.md
          files: artifacts/*

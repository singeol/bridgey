name: Verify Android Release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: gradle/actions/setup-gradle@v5
      - name: Restore Android signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/bridgey-release.jks"
      - run: chmod +x android/gradlew
      - name: Build signed release APK
        working-directory: android
        env:
          BRIDGEY_ANDROID_KEYSTORE: ${{ runner.temp }}/bridgey-release.jks
          BRIDGEY_ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          BRIDGEY_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          BRIDGEY_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease :app:testDebugUnitTest
      - name: Verify APK signature
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK"
          cp "$APK" Bridgey-Android-release-candidate.apk
          shasum -a 256 Bridgey-Android-release-candidate.apk > SHA256SUMS-Android.txt
      - uses: actions/upload-artifact@v7
        with:
          name: Bridgey-Android-release-candidate
          path: |
            Bridgey-Android-release-candidate.apk
            SHA256SUMS-Android.txt
          retention-days: 7
